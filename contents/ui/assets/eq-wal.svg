<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradijent za oblak: od plave ka žutoj u desnom donjem uglu -->
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Gradijent za strelicu: od crvene ka žutoj na vrhu -->
    <linearGradient id="arrowGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="80%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Blaga senka za dubinu -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#shadowFilter)">
    <!-- Oblak sa gradijentom ka žutoj u desnom donjem uglu -->
    <path d="M 28 96 
             C 12 96, 2 84, 2 68 
             C 2 54, 12 43, 26 41 
             C 31 22, 48 8, 70 8 
             C 92 8, 110 24, 114 45 
             C 122 48, 126 56, 126 64 
             C 126 80, 114 96, 96 96 
             Z" fill="url(#cloudGradient)" stroke="#0369A1" stroke-width="1.5" />

    <!-- Strelica sa prelazom od crvene ka žutoj -->
    <path d="M 46 122 
             L 82 122 
             L 82 56 
             L 104 56 
             L 64 6 
             L 24 56 
             L 46 56 
             Z" fill="url(#arrowGradient)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round" />
  </g>
</svg>